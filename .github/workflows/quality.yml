name: quality
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  powershell:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Install pinned tooling
        shell: pwsh
        run: |
          Set-PSRepository PSGallery -InstallationPolicy Trusted
          Install-Module Pester -RequiredVersion 5.7.1 -Scope CurrentUser -Force
          Install-Module PSScriptAnalyzer -RequiredVersion 1.24.0 -Scope CurrentUser -Force
      - name: Validate manifests
        shell: pwsh
        run: Test-ModuleManifest ./src/ClearGlass.NetworkOverdrive.psd1
      - name: Static analysis
        shell: pwsh
        run: Invoke-ScriptAnalyzer -Path src -Recurse -Severity Warning,Error -EnableExit
      - name: Unit tests
        shell: pwsh
        run: Invoke-Pester -Path tests -CI -Output Detailed
